[project]
name = "dante"
version = "1.0.0"
description = "DANTE — Data Assessment, Normalisation, Triage & Enrichment. A legacy master-data cleansing pipeline for ERP migrations."
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "pydantic>=2.9",
    "pandera>=0.21",
    "duckdb>=1.1",
    "rapidfuzz>=3.10",
    "openpyxl>=3.1",
    "PyYAML>=6.0",
    "Jinja2>=3.1",
    "typer>=0.15",
]

[project.urls]
Homepage = "https://phlppgdfry.github.io/excel-hell/"
Repository = "https://github.com/phlppgdfry/excel-hell"

[project.scripts]
dante = "dante.cli:app"

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dante"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
